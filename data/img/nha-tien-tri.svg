<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Nhà tiên tri kiểu anime với quả cầu pha lê" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="ball" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".25" stop-color="#CFE3FF"/>
      <stop offset=".7" stop-color="#5C8FD6"/>
      <stop offset="1" stop-color="#2F5D9F"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E3C27A" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#7FA8E6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2F5D9F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5D9F"/>
      <stop offset="1" stop-color="#1A3766"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F6B"/>
      <stop offset="1" stop-color="#1E2244"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4A12"/>
      <stop offset=".55" stop-color="#B88A2D"/>
      <stop offset="1" stop-color="#F2D58E"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5D9F"/>
      <stop offset="1" stop-color="#16305A"/>
    </linearGradient>
  </defs>

  <!-- quầng sáng sau lưng -->
