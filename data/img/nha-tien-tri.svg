    <path d="M330 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z"/>
    <path d="M318 280 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity=".8"/>
    <path d="M82 300 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 Z" opacity=".8"/>
