  <ellipse cx="146" cy="342" rx="18" ry="14" fill="#FBE3D3"/>
  <ellipse cx="254" cy="342" rx="18" ry="14" fill="#FBE3D3"/>
  <path d="M120 318 C126 332 134 340 146 344" stroke="#1A3766" stroke-width="16" fill="none" stroke-linecap="round"/>
