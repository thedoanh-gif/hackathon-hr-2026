  <path d="M138 104 Q200 92 262 102" stroke="#E3C27A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M236 6 C252 10 264 22 268 36" stroke="#2F5D9F" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M196 56 l4 9 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1 Z" fill="#E3C27A"/>
  <circle cx="226" cy="76" r="3" fill="#F2D58E"/><circle cx="170" cy="84" r="2.2" fill="#F2D58E"/>

