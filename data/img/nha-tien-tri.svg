  <circle cx="200" cy="318" r="86" fill="url(#glow)"/>
  <path d="M150 380 Q200 398 250 380 L240 404 Q200 416 160 404 Z" fill="#9D6F1D"/>
  <path d="M156 378 Q200 392 244 378" stroke="#E3C27A" stroke-width="5" fill="none" stroke-linecap="round"/>
