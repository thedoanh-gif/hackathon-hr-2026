  <path d="M200 236 L178 410 M200 236 L222 410" stroke="#B88A2D" stroke-width="3" fill="none" opacity=".7"/>
  <path d="M152 246 Q200 272 248 246" stroke="#E3C27A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="262" r="7" fill="#E3C27A"/><circle cx="200" cy="262" r="3" fill="#FFF6DD"/>

  <!-- cổ + mặt -->
  <rect x="188" y="210" width="24" height="30" rx="10" fill="#F6D7C3"/>
  <ellipse cx="200" cy="168" rx="78" ry="72" fill="#FBE3D3"/>

